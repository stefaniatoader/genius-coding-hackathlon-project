<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeatTheHeat</title>

  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    :root {
      --bg:        #98373c;
      --surface:   #112318;
      --border:    #1e3d28;
      --accent:    #4ade80;
      --accent2:   #86efac;
      --danger:    #f97316;
      --text:      #d1fae5;
      --muted:     #6b9e7e;
      --font-head: 'Playfair Display', serif;
      --font-body: 'Lato', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      margin: 0;
      padding: 2rem;
    }

    h1 {
      font-family: var(--font-head);
      color: var(--accent);
      text-align: center;
    }

    #globe {
      margin: 0 auto;
      display: block;
    }
  </style>
</head>
<body>

  <h1>BeatTheHeat</h1>
  <div id="globe" style="width:600px; height:600px;"></div>

  <script>
    const API_URL = "https://api.globe.gov/search/v1/measurement/protocol/measureddate/?protocols=surface_temperatures&startdate=2024-01-01&enddate=2026-01-01&geojson=TRUE&sample=TRUE";

    function getTempColor(temp) {
      if (temp >= 40) return '#ff0000';
      if (temp >= 30) return '#f97316';
      if (temp >= 20) return '#facc15';
      if (temp >= 10) return '#4ade80';
      return '#60a5fa';
    }

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        const points = data.features.map(f => ({
          lat: f.geometry.coordinates[1],
          lng: f.geometry.coordinates[0],
          temp: f.properties.surface_temperature,
          country: f.properties.countryName || 'Unknown',
          date: f.properties.measuredDate || ''
        }));

        Globe()
          .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-day.jpg')
          .backgroundColor('rgba(0,0,0,0)')
          .pointsData(points)
          .pointLat('lat')
          .pointLng('lng')
          .pointColor(p => getTempColor(p.temp))
          .pointAltitude(0.02)
          .pointRadius(0.4)
          .pointLabel(p => `
            <div style="
              background:#112318;
              color:#d1fae5;
              padding:8px 12px;
              border-radius:8px;
              border:1px solid #4ade80;
              font-family:Lato,sans-serif;
              font-size:13px;
            ">
              <b>${p.country}</b><br/>
              Temp: <b>${p.temp}°C</b><br/>
              ${p.date}
            </div>
          `)
          .onPointClick(p => {
            alert(` ${p.country}\n Temperature: ${p.temp}°C\n Date: ${p.date}`);
          })
          (document.getElementById('globe'));
      });
  </script>
</body>
</html>
